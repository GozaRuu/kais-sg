    :root {

      font-size: clamp(4.5rem, 15vw, 8rem);
      line-height: 1.16;
    }

    .sha {

      opacity: 0;
      animation: surface 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      animation-delay: calc(var(--i) * 140ms + 500ms);
    }

    @keyframes surface { to { opacity: var(--o); } }
    @keyframes settle { from { opacity: 0; } }

    /* the page ends in paper */
    .silence { height: 42svh; }

    footer {
      padding-bottom: 2.5rem;
      font-style: italic;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      opacity: 0.4;
    }

    footer a { color: inherit; }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .intro, .sha { animation: none; }
      .sha { opacity: var(--o); }
    }
